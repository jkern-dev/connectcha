name: Keep the hosted project awake

# Supabase Free pauses a project after a week without API activity (plan R-B).
# One authenticated read a day keeps it up. Needs repository secrets
# SUPABASE_URL (https://<ref>.supabase.co) and SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.HOSTED_ENABLED == 'true' }}
    steps:
      - name: Touch the Data API and the Auth service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Anonymous callers may call nothing, so the Data API answers 401 after
          # checking the grant in Postgres; that is a real query and counts as activity.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/get_unread_counts" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "content-type: application/json" -d '{}')
          case "$code" in 2*|401|403) echo "data api $code";; *) echo "data api $code"; exit 1;; esac
          curl -fsS -o /dev/null "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
          echo "ok $(date -u +%FT%TZ)"
