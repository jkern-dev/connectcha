name: iOS build and unit tests

# Runs on GitHub's macOS runners. Private repositories pay a 10x minute multiplier
# for macOS, so this is also runnable on demand. The plan's long-term home for
# iOS CI is Xcode Cloud once the Apple Developer account exists (OPEN_QUESTIONS.md).
#
# The integration tests that need the local Supabase stack skip themselves when
# the stack is not reachable, so only pure unit tests run here.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and pick a simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+' | sed 's/ *$//')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Connectcha.xcodeproj -scheme Connectcha \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:ConnectchaTests \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify --quiet
